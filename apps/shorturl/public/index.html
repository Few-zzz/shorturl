<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Short URL</title>
  <!-- โหลดก่อนแสดงหน้า เพื่อใช้ธีมที่ผู้ใช้เลือกไว้ตั้งแต่แรก ไม่ให้สีกะพริบ -->
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span>Short URL</span>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="สลับธีมมืดและสว่าง" title="สลับธีมมืดและสว่าง">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </header>

    <section class="hero">
      <h1>ย่อลิงก์ให้สั้น</h1>
      <p>วางลิงก์ยาว รับลิงก์สั้นพร้อม QR Code และดูจำนวนคลิกได้ทันที</p>
    </section>

    <form id="form" novalidate>
      <div class="field">
        <label class="sr-only" for="url">URL ที่ต้องการย่อ</label>
        <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://example.com/some/long/path" maxlength="2048" required>
        <button id="submit" class="primary" type="submit">ย่อลิงก์</button>
      </div>

      <div class="alias">
        <label for="alias">ชื่อที่กำหนดเอง <span class="optional">ไม่บังคับ</span></label>
        <div class="alias-input">
          <span id="alias-prefix" class="prefix"></span>
          <input id="alias" type="text" autocomplete="off" placeholder="my-link" maxlength="10">
        </div>
      </div>

      <!-- ตัวเลือกเสริม: ช่องกรอกจะแสดงเมื่อติ๊กเลือกเท่านั้น -->
      <div class="options">
        <label class="check"><input id="use-expiry" type="checkbox"> กำหนดวันหมดอายุ</label>
        <label class="check"><input id="use-password" type="checkbox"> ตั้งรหัสผ่าน</label>
      </div>

      <div id="expiry-field" class="option-field" hidden>
        <label for="expiry">หมดอายุเมื่อ</label>
        <div class="alias-input">
          <input id="expiry" type="datetime-local">
        </div>
      </div>

      <div id="password-field" class="option-field" hidden>
        <label for="password">รหัสผ่านสำหรับเปิดลิงก์</label>
        <div class="alias-input">
          <input id="password" type="password" autocomplete="new-password" minlength="4" maxlength="64" placeholder="4-64 ตัวอักษร">
        </div>
      </div>

      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <section id="result" class="result" aria-live="polite" hidden>
      <img id="qr-image" class="qr" alt="QR Code ของลิงก์สั้น" width="132" height="132">
      <div class="result-body">
        <p class="eyebrow">ลิงก์สั้นของคุณ</p>
        <a id="result-link" class="short-link" target="_blank" rel="noopener noreferrer"></a>
        <div class="actions">
          <button id="copy" class="ghost" type="button">คัดลอก</button>
          <a id="qr-download" class="ghost">ดาวน์โหลด QR</a>
        </div>
      </div>
    </section>

    <section class="list">
      <div class="list-head">
        <h2>ลิงก์ล่าสุด</h2>
        <button id="refresh" class="text" type="button">รีเฟรช</button>
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>ลิงก์สั้น</th>
              <th>URL ต้นทาง</th>
              <th class="num">คลิก</th>
              <th class="date">สร้างเมื่อ</th>
              <th><span class="sr-only">QR Code</span></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/wake.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
